<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotó album</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- https://jsonplaceholder.typicode.com/photos -->

    <div class="container">
        <div class="row">
            <h3 class="text-center">Galéria</h3>
        </div>
        <div class="row d-flex align-items-center justify-content-center">
            <div class="col-6 d-flex align-items-center justify-content-center">
                <img src="" alt="kep" id="aktualisKep" class="w-100 rounded">
            </div>
        </div>
    </div>
    <div class="row d-flex align-items-center justify-content-between my-2">
        <div class="col-4 d-flex align-items-center justify-content-center">
            <button id="elozoBtn" class="w-25 btn btn-primary">
                Előző
            </button>
        </div>
        <div class="col-4 d-flex align-items-center justify-content-center">
            <button id="betoltBtn" class="btn btn-success">Betölt</button>
        </div>
        <div class="col-4 d-flex align-items-center justify-content-center">
            <button id="kovetkezoBtn" class="w-25 btn btn-primary">Következő</button>
        </div>
    </div>

    <script>
        const elozoBtn = document.getElementById("elozoBtn");
        const betoltBtn = document.getElementById("betoltBtn");
        const kovetkezoBtn = document.getElementById("kovetkezoBtn");
        const aktualisKep = document.getElementById("aktualisKep");

        let KepData;
        aktualisKep.style.display="none";

        async function getData() {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/photos");

                if (!response.ok) {
                    alert("Valami hiba történt!")
                }

                const data = await response.json();
                KepData = data;
                betoltBtn.style.display = "none";
                KepFrissit(AktualisKepIndex);
                aktualisKep.style.display="block";
            } catch (error) {
                alert("hiba! ", error);
            }
        }

        betoltBtn.addEventListener("click", getData);

        let AktualisKepIndex = 0;

        function KepFrissit(index) {
            aktualisKep.src = KepData[index].url;
        }

        kovetkezoBtn.addEventListener("click", function () {
            if (AktualisKepIndex < KepData.length - 1) {
                AktualisKepIndex++;
            }
            KepFrissit(AktualisKepIndex);
        });

        elozoBtn.addEventListener("click",function(){
            if(AktualisKepIndex > 0){
                AktualisKepIndex--;
            }
            KepFrissit(AktualisKepIndex);
        });
    </script>
</body>

</html>
